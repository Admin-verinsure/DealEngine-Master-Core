name: CICD Pipeline

on:
  push:
    branches:
      - Rotary2024
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    name: Build .NET 6
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Clean and Restore Dependencies
        run: |
          dotnet nuget locals all --clear
          dotnet clean
          dotnet restore

      - name: Build Project
        run: dotnet build -c Release --no-restore

      - name: Publish Project
        run: |
          dotnet publish DealEngine.WebUI/DealEngine.WebUI.csproj -c Release --no-restore -o ./publish_output
          ls -la ./publish_output  # Debugging step

  deploy_insurerotaryoceania:
    name: Deploy to Rotary Oceania
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.URLINSUREROTARYOCEANIA }} >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Replace URLs in CKEditor
        run: |
          sed -i "s|https://localhost:44323/Image/CKGetAllImages|https://${{ secrets.URLINSUREROTARYOCEANIA }}/Image/CKGetAllImages|g" DealEngine.WebUI/wwwroot/ckeditor/ckeditor5-techcertain/build/ckeditor.js

      - name: Deploy Files via Rsync
        run: |
          if [ -d "./publish_output" ]; then
            rsync -avzhe "ssh -o StrictHostKeyChecking=no" ./publish_output/ ubuntu@${{ secrets.URLINSUREROTARYOCEANIA }}:/home/ubuntu/projects/dealengine
          else
            echo "⚠️ Error: Publish directory not found! Skipping rsync."
            exit 1
          fi

      # ✅ New: Verify Deployment by Checking Latest Modified File
      - name: Verify Deployment - Check Latest Modified File
        run: |
          ssh ubuntu@${{ secrets.URLINSUREROTARYOCEANIA }} 'ls -lt /home/ubuntu/projects/dealengine | head -n 5'

      # ✅ New: Verify Git Commit Hash on Server
      - name: Verify Git Commit Hash
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          ssh ubuntu@${{ secrets.URLINSUREROTARYOCEANIA }} "echo 'Deployed Commit Hash: ${COMMIT_HASH}' > /home/ubuntu/projects/dealengine/commit_hash.txt"
          ssh ubuntu@${{ secrets.URLINSUREROTARYOCEANIA }} "cat /home/ubuntu/projects/dealengine/commit_hash.txt"

      - name: Execute Final Deploy Script
        run: ssh ubuntu@${{ secrets.URLINSUREROTARYOCEANIA }} './DE-DeployFin.sh'
