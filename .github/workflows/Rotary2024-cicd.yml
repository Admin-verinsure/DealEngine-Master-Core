name: CICD Pipeline

on:
  push:
    branches:
      - Rotary2024
  workflow_dispatch:

jobs:
  build:
    name: Build .NET 6
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup .NET 6
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    - name: Clean Project
      run: dotnet clean
           dotnet nuget disable source IAG
           dotnet build -c Release

    #- name: Disable NuGet Source
     # run: dotnet nuget disable source IAG

    - name: Build Project
      run: dotnet build -c Release

 
  deploy_insurerotaryoceania:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    # Setup SSH agent with the private key stored in GitHub secrets
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
       ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    # Replace URLs in ckeditor
    - name: Replace URLs in ckeditor.js
      run: |
       sed -i "s|https://localhost:44323/Image/CKGetAllImages|https://${{ secrets.URLINSUREROTARYOCEANIA }}/Image/CKGetAllImages|g" DealEngine.WebUI/wwwroot/ckeditor/ckeditor5-techcertain/build/ckeditor.js
       sed -i "s|https://localhost:44323/Image/_|https://${{ secrets.URLINSUREROTARYOCEANIA }}/Image/_|g" DealEngine.WebUI/wwwroot/ckeditor/ckeditor5-techcertain/build/ckeditor.js
       sed -i "s|https://localhost:44323/Image/CKUpload|https://${{ secrets.URLINSUREROTARYOCEANIA }}/Image/CKUpload|g" DealEngine.WebUI/wwwroot/ckeditor/ckeditor5-techcertain/build/ckeditor.js
       sed -i "s|https://localhost:44323/Image/|https://${{ secrets.URLINSUREROTARYOCEANIA }}/Image/|g" DealEngine.WebUI/wwwroot/ckeditor/ckeditor5-techcertain/build/ckeditor.js
     
    #- name: Test SSH Connection
      #run: |
         #ssh -o StrictHostKeyChecking=no -i ${{ secrets.SSH_PRIVATE_KEY }} ubuntu@${{ secrets.URLINSUREROTARYOCEANIA }} "echo Connection Successful"

    # Execute Deploy Preparation Script
    - name: Execute Deploy Preparation Script
      run: |
        ssh -o StrictHostKeyChecking=no -p 22 ubuntu@${{ secrets.URLINSUREROTARYOCEANIA }} "echo 'SSH Connection Successful'"

    #- name: Copy Login Text File
    #  run: cp ~/general/_LoginText.cshtml DealEngine.WebUI/Views/Account/_LoginText.cshtml

    - name: Publish Project
      run: dotnet publish -c Release

    - name: Deploy Files via rsync
      run: |
        rsync -azhe ssh DealEngine.WebUI/bin/Release/net6.0/ ubuntu@${{ secrets.URLINSUREROTARYOCEANIA }}:/home/ubuntu/projects/dealengine

    - name: Execute Final Deploy Script
      run: ssh ubuntu@${{ secrets.URLINSUREROTARYOCEANIA }} './DE-DeployFin.sh' #
