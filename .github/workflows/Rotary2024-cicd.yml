name: CICD Pipeline

on:
  push:
    branches:
      - Rotary2024  # Change as needed
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    name: Build .NET 6
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Clean and Restore Dependencies
        run: |
          dotnet nuget locals all --clear
          dotnet clean
          dotnet restore

      - name: Disable NuGet Source if Exists
        run: |
          if dotnet nuget list source | grep -q "IAG"; then
            dotnet nuget disable source IAG
          else
            echo "NuGet source 'IAG' not found. Skipping."
          fi

      - name: Build Project
        run: dotnet build -c Release --no-restore

  deploy_insurerotaryoceania:
    name: Deploy to Rotary Oceania
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.URLINSUREROTARYOCEANIA }} >> ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Replace URLs in CKEditor
        run: |
          sed -i "s|https://localhost:44323/Image/CKGetAllImages|https://${{ secrets.URLINSUREROTARYOCEANIA }}/Image/CKGetAllImages|g" DealEngine.WebUI/wwwroot/ckeditor/ckeditor5-techcertain/build/ckeditor.js
          sed -i "s|https://localhost:44323/Image/_|https://${{ secrets.URLINSUREROTARYOCEANIA }}/Image/_|g" DealEngine.WebUI/wwwroot/ckeditor/ckeditor5-techcertain/build/ckeditor.js
          sed -i "s|https://localhost:44323/Image/CKUpload|https://${{ secrets.URLINSUREROTARYOCEANIA }}/Image/CKUpload|g" DealEngine.WebUI/wwwroot/ckeditor/ckeditor5-techcertain/build/ckeditor.js
          sed -i "s|https://localhost:44323/Image/|https://${{ secrets.URLINSUREROTARYOCEANIA }}/Image/|g" DealEngine.WebUI/wwwroot/ckeditor/ckeditor5-techcertain/build/ckeditor.js

      - name: Test SSH Connection
        run: ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.URLINSUREROTARYOCEANIA }} "echo 'SSH Connection Successful'"

      - name: Execute Deploy Preparation Script
        run: ssh ubuntu@${{ secrets.URLINSUREROTARYOCEANIA }} './DE-DeployPrep.sh'

      - name: Copy Login Text File
        run: cp ~/general/_LoginText.cshtml DealEngine.WebUI/Views/Account/_LoginText.cshtml

      - name: Publish Project
        run: |
          dotnet publish DealEngine.WebUI/DealEngine.WebUI.csproj -c Release --no-restore -o ./publish_output
          ls -la ./publish_output  # Debugging step to ensure output exists

      - name: Deploy Files via Rsync
        run: |
          if [ -d "./publish_output" ]; then
            rsync -azhe "ssh -o StrictHostKeyChecking=no" ./publish_output/ ubuntu@${{ secrets.URLINSUREROTARYOCEANIA }}:/home/ubuntu/projects/dealengine
          else
            echo "⚠️ Error: Publish directory not found! Skipping rsync."
            exit 1
          fi

      - name: Execute Final Deploy Script
        run: ssh ubuntu@${{ secrets.URLINSUREROTARYOCEANIA }} './DE-DeployFin.sh'
